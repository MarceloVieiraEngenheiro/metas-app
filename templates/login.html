{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="form-card">
                <h2 class="fw-bold mb-4 text-center">
                    <i class="fas fa-sign-in-alt text-primary me-2"></i>Entrar
                </h2>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="email" name="email" class="form-control" required
                               placeholder="seu@email.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Senha</label>
                        <input type="password" name="password" class="form-control" required
                               placeholder="Sua senha">
                    </div>
                    <button type="submit" class="btn btn-primary rounded-pill px-4 w-100">
                        <i class="fas fa-sign-in-alt me-1"></i> Entrar
                    </button>
                </form>
                <hr class="my-4">
                <p class="text-center mb-0 text-muted">
                    Nao tem conta? <a href="{{ url_for('register') }}" class="text-decoration-none fw-semibold">Cadastre-se</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
