databases:
  - name: metas-db
    databaseName: metas
    ipAllowList: []

services:
  - type: web
    name: metas-app
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: DATABASE_URL
        fromDatabase:
          name: metas-db
          property: connectionString